<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도서 검색 서비스</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>도서 검색 서비스</h1>
  </header>

  <main>
    <section class="panel">
      <form id="search-form" class="search-form">
        <input type="text" name="title" placeholder="도서명 검색">
        <select name="category" id="search-category">
          <option value="">전체 카테고리</option>
        </select>
        <input type="text" name="author" placeholder="저자">
        <input type="text" name="publisher" placeholder="출판사">
        <button type="submit">검색</button>
        <button type="button" id="reset-search">초기화</button>
      </form>
      <button type="button" id="create-button" class="primary">+ 새 도서 등록</button>
    </section>

    <p id="search-error" class="error" hidden></p>

    <section id="form-section" class="panel" hidden>
      <h2 id="form-title">새 도서 등록</h2>
      <form id="book-form">
        <div class="form-grid">
          <label>도서명
            <input type="text" name="title" required maxlength="255">
          </label>
          <label>저자
            <input type="text" name="author" required maxlength="255">
          </label>
          <label>출판사
            <input type="text" name="publisher" required maxlength="255">
          </label>
          <label>카테고리
            <select name="category" id="form-category" required>
              <option value="">선택</option>
            </select>
          </label>
          <label>출간일
            <input type="date" name="published_date" required>
          </label>
          <label>ISBN
            <input type="text" name="isbn" required maxlength="20">
          </label>
          <label>가격
            <input type="number" name="price" required min="0" step="1">
          </label>
          <label>재고
            <input type="number" name="stock" required min="0" step="1">
          </label>
        </div>
        <p id="form-error" class="error" hidden></p>
        <div class="form-actions">
          <button type="submit" id="form-submit">등록</button>
          <button type="button" id="form-cancel">취소</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <table id="results-table">
        <thead>
          <tr>
            <th>도서명</th>
            <th>저자</th>
            <th>출판사</th>
            <th>카테고리</th>
            <th>출간일</th>
            <th>ISBN</th>
            <th>가격</th>
            <th>재고</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
      <p id="empty-state" hidden>검색 결과가 없습니다.</p>

      <div class="pagination">
        <button type="button" id="prev-page">이전</button>
        <span id="page-info"></span>
        <button type="button" id="next-page">다음</button>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
